name: Build patched Seerr

# Builds the latest Seerr release with the patch applied, the same way the
# official image is built. Runs when upstream publishes a new release, when
# the patch branch changes, or when this branch changes.
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
  push:
    branches: [unraid]

permissions:
  contents: read
  packages: write

concurrency:
  group: build

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/seerr
  UPSTREAM: seerr-team/seerr
  PATCH_BRANCH: feat/plex-watchlist

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Find the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # releases/latest skips pre-releases, like the official :latest tag.
          tag=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          if [ -z "$tag" ]; then
            echo "::error::Could not read the latest $UPSTREAM release"
            exit 1
          fi

          echo "Latest release is $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Apply the patch to the release
        id: patch
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git clone --quiet --filter=blob:none "https://github.com/$UPSTREAM" seerr
          cd seerr
          git checkout --quiet "$TAG"

          # The official image reports the release commit as its version.
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          # The patch is every commit on the patch branch that upstream does not have.
          git fetch --quiet "https://github.com/$GITHUB_REPOSITORY" "$PATCH_BRANCH"
          commits=$(git rev-list --reverse --no-merges origin/develop..FETCH_HEAD)
          if [ -z "$commits" ]; then
            echo "::error::No patch commits found on $PATCH_BRANCH"
            exit 1
          fi

          git log --oneline --no-walk $commits
          if ! git -c user.name=build -c user.email=build@localhost cherry-pick $commits; then
            echo "::error::The patch no longer applies to Seerr $TAG. Rebase $PATCH_BRANCH onto upstream and push it."
            exit 1
          fi

          echo "sha=$(git rev-parse --short FETCH_HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this combination was already built
        id: check
        env:
          TAG: ${{ steps.release.outputs.tag }}
          PATCH_SHA: ${{ steps.patch.outputs.sha }}
        run: |
          build_tag="$TAG-$PATCH_SHA-${GITHUB_SHA::7}"
          echo "tag=$build_tag" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$IMAGE:$build_tag" > /dev/null 2>&1; then
            echo "Already built $IMAGE:$build_tag"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.skip != 'true'

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.skip != 'true'
        with:
          context: seerr
          file: seerr/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            COMMIT_TAG=${{ steps.patch.outputs.commit }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.release.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.check.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
            org.opencontainers.image.description=Seerr ${{ steps.release.outputs.tag }} with the ${{ env.PATCH_BRANCH }} patch
